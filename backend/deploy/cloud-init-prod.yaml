#cloud-config
# МАТА backend — прод-деплой на свежей Ubuntu (Yandex Cloud).
# Этот файл ПУБЛИЧНЫЙ и не содержит секретов:
#   - SSH-ключ ниже — ПУБЛИЧНЫЙ (не секрет), приватный только у владельца.
#   - Секреты .env (SECRET_KEY/JWT/пароль БД) генерируются СЛУЧАЙНО на самом сервере.
# Доступ по ключу гарантируется парой: ssh_authorized_keys (ниже) + метаданные enable-oslogin=false
# (их выставляет скрипт создания ВМ), поэтому ключ применяется уже на первой загрузке.
package_update: true
package_upgrade: false
packages:
  - docker.io
  - docker-compose-v2
  - git
  - rsync
ssh_authorized_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL3wCmvihkc9k36yP3k9Ld4uJ127FSu29mG5zjLkIMVx mata-prod2
write_files:
  - path: /opt/mata-deploy.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Без set -x — чтобы секреты не попали в лог/serial.
      set -euo pipefail
      # Надёжная установка пакетов: cloud-init `packages:` иногда падает на транзиентном
      # сбое apt/зеркала — тогда docker.service отсутствует и деплой умирает. Ретраим.
      export DEBIAN_FRONTEND=noninteractive
      # DPkg::Lock::Timeout=600 — ЖДАТЬ до 10 мин освобождения блокировки apt, а не
      # падать сразу: на свежей ВМ фоновый apt-daily-upgrade держит lock, из-за чего
      # install docker падал все ретраи → FATAL «docker не установился» (грабли).
      for i in 1 2 3 4 5 6; do
        apt-get -o DPkg::Lock::Timeout=600 update -y && \
        apt-get -o DPkg::Lock::Timeout=600 install -y docker.io docker-compose-v2 git rsync && break
        echo "apt attempt $i failed — retrying in 20s..."; sleep 20
      done
      command -v docker >/dev/null || { echo "FATAL: docker не установился после ретраев"; exit 1; }
      systemctl enable --now docker
      usermod -aG docker yc-user || true
      rm -rf /opt/mata && git clone --depth 1 https://github.com/Smallfoi/mata-ecosystem.git /opt/mata
      # Статика САЙТ МАТА → чистый путь /opt/mata-site (имя папки с пробелом/кириллицей),
      # без внутренних файлов (*.md, Референсы) — их публиковать нельзя.
      rm -rf /opt/mata-site && cp -r /opt/mata/"САЙТ МАТА" /opt/mata-site
      rm -f /opt/mata-site/*.md /opt/mata-site/AGENTS.md 2>/dev/null || true
      rm -rf /opt/mata-site/"Референсы" 2>/dev/null || true
      cd /opt/mata/backend
      gen() { openssl rand -hex 32; }
      umask 077
      # Стабильные секреты (POSTGRES_PASSWORD/DJANGO_SECRET_KEY/JWT_SECRET) НЕ генерируем —
      # они приходят из Lockbox ниже (одни на все пересоздания, иначе постоянная БД
      # с прежним паролем перестанет пускать web).
      cat > .env <<ENVEOF
      DJANGO_DEBUG=0
      DJANGO_ALLOWED_HOSTS=api.mata-club.ru
      DJANGO_CORS_ORIGINS=https://mata-club.ru,https://www.mata-club.ru,https://mata-media.storage.yandexcloud.net
      POSTGRES_DB=mata
      POSTGRES_USER=mata
      POSTGRES_HOST=db
      POSTGRES_PORT=5432
      REDIS_URL=redis://redis:6379/0
      DJANGO_MEDIA_ROOT=/srv/media
      DJANGO_STATIC_ROOT=/app/staticfiles
      SITE_PREVIEW_URL=https://mata-club.ru
      APP_PREVIEW_URL=https://mata-media.storage.yandexcloud.net/mata-app-preview/index.html
      LEGAL_DOCS_DIR=/legal_docs
      TLS_DOMAIN=api.mata-club.ru
      TLS_EMAIL=admin@mata-club.ru
      TLS_EXTRA_SAN=mata-club.ru,www.mata-club.ru,158-160-12-117.nip.io
      ENVEOF
      # Секреты из Yandex Lockbox (S3, и др.) — через сервисный аккаунт этой ВМ.
      # Значения не хранятся ни в репозитории, ни в метаданных: только в Lockbox.
      LB_SECRET_ID="e6q1ias432ne7vtogghv"
      IAM=$(curl -s -H "Metadata-Flavor: Google" "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token" 2>/dev/null | python3 -c "import sys,json;print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null || true)
      if [ -n "$IAM" ]; then
        curl -s -H "Authorization: Bearer $IAM" "https://payload.lockbox.api.cloud.yandex.net/lockbox/v1/secrets/$LB_SECRET_ID/payload" 2>/dev/null \
          | python3 -c "import sys,json,shlex;[print(e['key']+'='+shlex.quote(e.get('textValue',''))) for e in json.load(sys.stdin).get('entries',[])]" >> .env 2>/dev/null || true
      fi
      # Критичные секреты обязаны прийти из Lockbox (иначе БД/токены сломаются) — иначе стоп.
      for k in POSTGRES_PASSWORD DJANGO_SECRET_KEY JWT_SECRET; do
        grep -q "^$k=" .env || { echo "FATAL: $k отсутствует (Lockbox не отдал) — abort"; exit 1; }
      done
      # Постоянный диск под БД (второй диск /dev/vdb) — данные переживают пересоздание ВМ.
      # Форматируем ТОЛЬКО пустой диск (иначе потеряли бы данные); монтируем в /mnt/data.
      DBDEV=/dev/vdb
      mkdir -p /mnt/data
      if [ -b "$DBDEV" ]; then
        blkid "$DBDEV" >/dev/null 2>&1 || mkfs.ext4 -F "$DBDEV"
        DBUUID=$(blkid -s UUID -o value "$DBDEV")
        grep -q "$DBUUID" /etc/fstab || echo "UUID=$DBUUID /mnt/data ext4 defaults,nofail 0 2" >> /etc/fstab
        mount -a
      fi
      mountpoint -q /mnt/data || { echo "FATAL: /mnt/data not mounted — abort"; exit 1; }
      mkdir -p /mnt/data/pgdata
      # nginx-конфиг под наш домен
      cp nginx/mata.conf.example nginx/mata.conf
      sed -i 's/api\.mata-store\.ru/api.mata-club.ru/g' nginx/mata.conf
      # Ядро стека (nginx поднимется позже — после выпуска TLS, когда DNS укажет на этот IP).
      docker compose -f docker-compose.prod.yml --env-file .env up -d --build db redis web worker beat
      # Внутренний smoke (не зависит от nginx/TLS).
      sleep 15
      ./deploy/smoke.sh || true
      docker compose -f docker-compose.prod.yml --env-file .env exec -T web python manage.py seed_catalog || true
      # Прод-суперпользователь админки (DJANGO_SUPERUSER_* из Lockbox) — идемпотентно (|| true).
      docker compose -f docker-compose.prod.yml --env-file .env exec -T web python manage.py createsuperuser --noinput 2>/dev/null || true
      # Публикация юр-документов из docs/legal/*.md (реквизиты LEGAL_* из Lockbox → .env).
      # Идемпотентно; без реквизитов команда сама пропускает публикацию.
      docker compose -f docker-compose.prod.yml --env-file .env exec -T web python manage.py publish_legal || true
      echo "MATA deploy done" > /opt/mata-deploy.done
      # Первичный выпуск TLS прямо в деплое (DNS уже указывает на статический IP).
      # Вывод идёт в serial-лог — видно ошибку certbot, если что.
      echo "=== TLS issue (inline) ==="
      ./deploy/tls.sh issue 2>&1 || echo "=== TLS issue FAILED (см. вывод выше) ==="
      # Разовый бэкап при первом развёртывании (проверка выгрузки в S3-бакет бэкапов).
      ./deploy/backup.sh >> /var/log/mata-backup.log 2>&1 || true
  - path: /opt/mata-tls.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Повторяем выпуск TLS раз в 2 минуты, пока DNS api.mata-club.ru не начнёт
      # указывать на этот сервер. Как только сертификат выпущен — выходим (файл-маркер).
      set -uo pipefail
      cd /opt/mata/backend 2>/dev/null || exit 0
      [ -f nginx/certs/fullchain.pem ] && exit 0
      [ -f /opt/mata-deploy.done ] || exit 0
      ./deploy/tls.sh issue >> /var/log/mata-tls.log 2>&1
  # ── Авто-деплой: тянем main и катим изменения БЕЗ пересоздания ВМ ──────────────
  # Крон (ниже) запускает это раз в 2 минуты. При новом коммите в main:
  # git reset --hard → пересобрать статику сайта и nginx-конфиг → up -d --build
  # (web-контейнер на старте сам делает migrate+collectstatic). db/redis не трогаем.
  # .env/сертификаты — untracked, reset --hard их НЕ удаляет.
  - path: /opt/mata-autodeploy.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -uo pipefail
      exec 9>/var/lock/mata-autodeploy.lock
      flock -n 9 || exit 0                      # прошлый прогон ещё идёт — выходим
      [ -f /opt/mata-deploy.done ] || exit 0    # первичный деплой ещё не закончился
      cd /opt/mata || exit 0
      git fetch origin main --quiet || exit 0
      LOCAL=$(git rev-parse HEAD)
      REMOTE=$(git rev-parse origin/main)
      [ "$LOCAL" = "$REMOTE" ] && exit 0         # нечего катить
      echo "=== $(date -u) autodeploy $LOCAL -> $REMOTE ==="
      git reset --hard origin/main
      # Статика САЙТ МАТА → /opt/mata-site. ВАЖНО: каталог bind-mount в РАБОТАЮЩИЙ
      # nginx — НЕЛЬЗЯ rm -rf (удалит inode → порвёт монтирование → сайт 403/500,
      # а `up -d nginx` его не пересоздаёт, т.к. образ/конфиг те же). Синхронизируем
      # содержимое НА МЕСТЕ (тот же inode) — nginx сразу видит новые файлы.
      mkdir -p /opt/mata-site
      if command -v rsync >/dev/null 2>&1; then
        rsync -a --delete --exclude='*.md' --exclude='AGENTS.md' --exclude='Референсы' \
          /opt/mata/"САЙТ МАТА"/ /opt/mata-site/
      else
        cp -rT /opt/mata/"САЙТ МАТА" /opt/mata-site
        find /opt/mata-site -maxdepth 1 -name '*.md' -delete 2>/dev/null || true
        rm -f /opt/mata-site/AGENTS.md 2>/dev/null || true
        rm -rf /opt/mata-site/"Референсы" 2>/dev/null || true
      fi
      cd /opt/mata/backend
      cp nginx/mata.conf.example nginx/mata.conf
      sed -i 's/api\.mata-store\.ru/api.mata-club.ru/g' nginx/mata.conf
      # Пересобрать код: web/worker/beat (migrate+collectstatic — в команде web).
      # timeout на каждый шаг — чтобы зависание не держало flock и не блокировало след. прогоны.
      timeout 360 docker compose -f docker-compose.prod.yml --env-file .env up -d --build web worker beat || true
      # Догнать публикацию юр-документов (идемпотентно; published_at меняет только при изменении текста).
      timeout 120 docker compose -f docker-compose.prod.yml --env-file .env exec -T web python manage.py publish_legal || true
      # nginx: только перечитать конфиг (статика читается на каждый запрос — синк уже виден).
      timeout 60 docker compose -f docker-compose.prod.yml --env-file .env exec -T nginx nginx -s reload 2>/dev/null \
        || timeout 120 docker compose -f docker-compose.prod.yml --env-file .env up -d nginx || true
      echo "=== $(date -u) autodeploy done ==="
  # ── SSH на портах 22 и 2222 (провайдер владельца режет 22 → прямой доступ на 2222) ─
  # ГРАБЛИ Ubuntu 24.04: НЕЛЬЗЯ задавать порт одновременно в ssh.socket И в sshd_config.
  # socket-активация + Port в sshd_config конфликтуют (оба пытаются держать порт) →
  # sshd падает при КАЖДОМ коннекте: kex_exchange_identification: Connection closed by
  # remote host (и на 22, и на 2222). Поэтому socket-активацию ОТКЛЮЧАЕМ в runcmd, а
  # порты задаём ТОЛЬКО в sshd_config — классический демон слушает 22 и 2222.
  - path: /etc/ssh/sshd_config.d/mata-port.conf
    content: |
      Port 22
      Port 2222
runcmd:
  - bash /opt/mata-deploy.sh 2>&1 | tee /var/log/mata-deploy.log
  - (crontab -l 2>/dev/null; echo "*/2 * * * * /opt/mata-tls.sh") | crontab -
  - (crontab -l 2>/dev/null; echo "0 3 * * 1 cd /opt/mata/backend && ./deploy/tls.sh renew >> /var/log/mata-tls.log 2>&1") | crontab -
  - (crontab -l 2>/dev/null; echo "0 4 * * * cd /opt/mata/backend && ./deploy/backup.sh >> /var/log/mata-backup.log 2>&1") | crontab -
  - (crontab -l 2>/dev/null; echo "*/2 * * * * /opt/mata-autodeploy.sh >> /var/log/mata-autodeploy.log 2>&1") | crontab -
  # SSH: отключаем socket-активацию (иначе конфликт с Port из sshd_config → sshd падает
  # с kex_exchange_identification: Connection closed), поднимаем классический демон на 22+2222.
  - systemctl disable --now ssh.socket 2>/dev/null || true
  - systemctl daemon-reload
  - systemctl enable ssh 2>/dev/null || systemctl enable sshd 2>/dev/null || true
  - systemctl restart ssh 2>/dev/null || systemctl restart sshd 2>/dev/null || true

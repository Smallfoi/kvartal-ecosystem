name: Kvartal web

# Web-версия «Квартала» на нашем домене: https://mata-club.ru/kvartal/
#
# Зачем: на iPhone приложение нельзя поставить файлом — только через TestFlight,
# а он требует платного Apple Developer. Пока аккаунта нет, web-версия по ссылке
# (Safari → «Поделиться» → «На экран „Домой“») — единственный способ показать
# «Квартал» владельцу айфона. Ограничение iOS: фоновый GPS в Safari не работает,
# записать пробежку с погашенным экраном не выйдет — остальное работает.
#
# Сборка кладётся в S3 (префикс kvartal-web/), а nginx отдаёт её по пути /kvartal/
# с НАШЕГО домена — иначе браузер заблокирует запросы к API (CORS на проде
# разрешён только для mata-club.ru).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mata_kvartal/**'
      - 'tools/upload_app_preview.py'
      - '.github/workflows/kvartal-web.yml'

concurrency:
  group: kvartal-web
  cancel-in-progress: true

jobs:
  build-deploy:
    name: Build & deploy Kvartal web to S3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.1
          channel: stable
          cache: true

      # Флаги важны: --no-web-resources-cdn (CanvasKit локально — CDN gstatic из РФ
      # недоступен, иначе белый экран), --pwa-strategy=none (service-worker кэширует
      # старую сборку), --base-href /kvartal/ (путь, по которому отдаёт nginx),
      # KVARTAL_API_BASE_URL — прод-API.
      - name: Build web
        working-directory: mata_kvartal
        run: |
          flutter pub get
          flutter build web --release --pwa-strategy=none --no-web-resources-cdn \
            --no-tree-shake-icons \
            --base-href /kvartal/ \
            --dart-define=KVARTAL_API_BASE_URL=https://api.mata-club.ru/v1

      - name: Install boto3
        run: pip install boto3

      - name: Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MEDIA_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_S3_SECRET_KEY }}
          S3_PREFIX: kvartal-web/
          BUILD_DIR: mata_kvartal/build/web
        run: python tools/upload_app_preview.py

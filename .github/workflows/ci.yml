name: CI

# Проверки качества для монорепо экосистемы STAW.
# Гоняются на каждый push в main и на каждый Pull Request в main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Отменяем устаревшие прогоны для той же ветки/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter · ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [kvartal-app, sport_store]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.1
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  backend:
    name: Backend · Django
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: kvartal
          POSTGRES_USER: kvartal
          POSTGRES_PASSWORD: kvartal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: kvartal
      POSTGRES_USER: kvartal
      POSTGRES_PASSWORD: kvartal
    defaults:
      run:
        working-directory: backend/django_api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Tests (анти-чит + эндпоинты)
        run: python manage.py test --verbosity 2

  site-js:
    name: Site · JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Синтакс-гейт клиентского JS сайта (content.js/editor.js/promo.js и др.):
      # node --check ловит рецидивные синтакс-ошибки, ломавшие витрину/конструктор,
      # и НЕ завязан на поведение (не бьётся при легитимных правках логики).
      - name: Syntax-check site JS (node --check)
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r f; do
            echo "node --check: $f"
            node --check "$f"
            count=$((count + 1))
          done < <(find "САЙТ МАТА" -maxdepth 1 -name '*.js' | sort)
          echo "checked $count file(s)"
          test "$count" -gt 0   # страховка: путь с кириллицей нашёлся, файлы проверены

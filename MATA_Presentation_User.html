<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>МАТА — что это и зачем</title>
<style>
  @page { size: 423mm 265mm; margin: 0; }
  html,body { margin:0; padding:0; background:#070a14; }
  svg { display:block; width:100%; height:100%; }
  text { font-family:'Manrope','Segoe UI',system-ui,Arial,sans-serif; }
  .t-title { font-weight:800; }
  .t-h { font-weight:700; }
  .t-sec { font-weight:700; letter-spacing:2.4px; }
</style>
</head>
<body>
<svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="-8%" r="120%">
      <stop offset="0%" stop-color="#13203b"/><stop offset="46%" stop-color="#0b1120"/><stop offset="100%" stop-color="#05070f"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.03"/>
    </pattern>
    <linearGradient id="cardSlate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141a26"/><stop offset="1" stop-color="#0d121c"/></linearGradient>
    <linearGradient id="cardCyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2533"/><stop offset="1" stop-color="#0a1622"/></linearGradient>
    <linearGradient id="cardGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#11281e"/><stop offset="1" stop-color="#0a1a14"/></linearGradient>
    <linearGradient id="cardPlan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15192360"/><stop offset="1" stop-color="#0c111b"/></linearGradient>
    <linearGradient id="cardHero" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#102a22"/><stop offset="0.5" stop-color="#10243a"/><stop offset="1" stop-color="#1a1638"/></linearGradient>
    <radialGradient id="heroGlow" cx="50%" cy="5%" r="58%"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.12"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/></filter>
    <filter id="softSm" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>

    <symbol id="ic-run" viewBox="0 0 24 24"><circle cx="14.5" cy="4.6" r="2" fill="none" stroke-width="1.7"/><path d="M13.6 7.2l-3.4 3 2.3 2.6 1 5.4M10.2 10.2l-4 1.1M12.5 12.8l4.2 1.8 1.2 3.9M6.5 21l2.6-3.8" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke-width="1.7"/><path d="M12 7.3l1.5 3 3.3.5-2.4 2.3.6 3.3L12 18.3l-3 1.1.6-3.3-2.4-2.3 3.3-.5z" fill="none" stroke-width="1.3" stroke-linejoin="round"/></symbol>
    <symbol id="ic-users" viewBox="0 0 24 24"><circle cx="9" cy="8.4" r="3" fill="none" stroke-width="1.7"/><path d="M3.6 19c0-3 2.5-5 5.4-5s5.4 2 5.4 5" fill="none" stroke-width="1.7" stroke-linecap="round"/><path d="M16.2 6.1a3 3 0 0 1 0 5.7M17.2 14.4c2.3.5 3.9 2.4 3.9 4.6" fill="none" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="ic-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 6.1L20 11l-6.1 1.9L12 19l-1.9-6.1L4 11l6.1-1.9z" fill="none" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="ic-shoe" viewBox="0 0 24 24"><path d="M3 16.6v-4.2l4-1 3 2 7 1.9c2 .6 3.9 1.1 3.9 3.1v.7H3.4z" fill="none" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 11.6l1.6 2.1M10 13.6l1.6 1.9" fill="none" stroke-width="1.4" stroke-linecap="round"/></symbol>
    <symbol id="ic-map" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z" fill="none" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.6" fill="none" stroke-width="1.7"/></symbol>
    <symbol id="ic-bag" viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8z" fill="none" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8a3 3 0 0 1 6 0" fill="none" stroke-width="1.8"/></symbol>
    <symbol id="ic-check" viewBox="0 0 16 16"><path d="M3 8.4l3.2 3.2L13 4.6" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-arrow" viewBox="0 0 16 16"><path d="M2.5 8h9.5M8.6 4.2L12.4 8 8.6 11.8" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#heroGlow)"/>

  <!-- ===== HEADER ===== -->
  <rect x="48" y="40" width="40" height="40" rx="11" fill="#0A84FF" opacity="0.18"/>
  <text x="58" y="68" class="t-title" font-size="22" fill="#3b9bff">A</text>
  <text x="100" y="64" class="t-title" font-size="22" fill="#ffffff" letter-spacing="1.2">МАТА</text>
  <text x="101" y="84" font-size="12" fill="#7d8ba3" font-weight="600" letter-spacing="0.3">экосистема для бегунов</text>

  <text x="800" y="116" class="t-title" font-size="34" text-anchor="middle"><tspan fill="#f3f7fc">Город — твоя беговая площадка. </tspan><tspan fill="#5fd0f0">Бег, который окупается.</tspan></text>
  <!-- positioning pills -->
  <g filter="url(#softSm)">
    <rect x="503" y="140" width="172" height="30" rx="15" fill="#0c1424" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.1"/>
    <rect x="693" y="140" width="186" height="30" rx="15" fill="#0c1424" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1.1"/>
    <rect x="897" y="140" width="200" height="30" rx="15" fill="#0c1424" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1.1"/>
  </g>
  <circle cx="521" cy="155" r="4" fill="#fbbf24"/><text x="535" y="160" font-size="13" font-weight="600" fill="#d7e0ee">Система лояльности</text>
  <circle cx="711" cy="155" r="4" fill="#a78bfa"/><text x="725" y="160" font-size="13" font-weight="600" fill="#d7e0ee">Игра — захват города</text>
  <circle cx="915" cy="155" r="4" fill="#22d3ee"/><text x="929" y="160" font-size="13" font-weight="600" fill="#d7e0ee">Экосистема для бегунов</text>
  <line x1="48" y1="186" x2="1552" y2="186" stroke="#172339" stroke-width="1.4"/>

  <!-- ===== БОЛЬ → РЕШЕНИЕ ===== -->
  <text x="48" y="210" class="t-sec" font-size="12" fill="#6aa6ef">КАКУЮ БОЛЬ МЫ РЕШАЕМ</text>
  <g filter="url(#soft)">
    <rect x="48"   y="224" width="355" height="178" rx="17" fill="url(#cardSlate)" stroke="#3b82f6" stroke-opacity="0.34" stroke-width="1.3"/>
    <rect x="431"  y="224" width="355" height="178" rx="17" fill="url(#cardSlate)" stroke="#fbbf24" stroke-opacity="0.34" stroke-width="1.3"/>
    <rect x="814"  y="224" width="355" height="178" rx="17" fill="url(#cardSlate)" stroke="#34d399" stroke-opacity="0.34" stroke-width="1.3"/>
    <rect x="1197" y="224" width="355" height="178" rx="17" fill="url(#cardSlate)" stroke="#a78bfa" stroke-opacity="0.34" stroke-width="1.3"/>
  </g>
  <rect x="70" y="248" width="42" height="42" rx="12" fill="#3b82f6" fill-opacity="0.16"/><use href="#ic-spark" x="76" y="254" width="30" height="30" stroke="#7fb0f7"/>
  <text x="126" y="275" class="t-h" font-size="17.5" fill="#eef3fb">Мотивация, не скука</text>
  <circle cx="74" cy="320" r="3.2" fill="#ef6b6b"/><text x="88" y="325" font-size="13.5" fill="#94a4bd">Начинаю бегать — бросаю через неделю.</text>
  <circle cx="74" cy="350" r="3.2" fill="#34d399"/><text x="88" y="355" font-size="13.5" fill="#e7eefb" font-weight="600">Бег как игра: захватывай районы</text>
  <text x="88" y="376" font-size="13.5" fill="#e7eefb" font-weight="600">города и держи их за собой.</text>

  <rect x="453" y="248" width="42" height="42" rx="12" fill="#fbbf24" fill-opacity="0.15"/><use href="#ic-coin" x="459" y="254" width="30" height="30" stroke="#f3cf86"/>
  <text x="509" y="275" class="t-h" font-size="17.5" fill="#f6efde">Награда за каждый шаг</text>
  <circle cx="457" cy="320" r="3.2" fill="#ef6b6b"/><text x="471" y="325" font-size="13.5" fill="#94a4bd">Тренируюсь — а взамен ничего.</text>
  <circle cx="457" cy="350" r="3.2" fill="#34d399"/><text x="471" y="355" font-size="13.5" fill="#e7eefb" font-weight="600">Каждый километр приносит</text>
  <text x="471" y="376" font-size="13.5" fill="#e7eefb" font-weight="600">реальные баллы на твой счёт.</text>

  <rect x="836" y="248" width="42" height="42" rx="12" fill="#34d399" fill-opacity="0.16"/><use href="#ic-shoe" x="842" y="254" width="30" height="30" stroke="#7eecbf"/>
  <text x="892" y="275" class="t-h" font-size="17.5" fill="#e6f6ed">Экипировка окупается</text>
  <circle cx="840" cy="320" r="3.2" fill="#ef6b6b"/><text x="854" y="325" font-size="13.5" fill="#94a4bd">Кроссовки и форма — это дорого.</text>
  <circle cx="840" cy="350" r="3.2" fill="#34d399"/><text x="854" y="355" font-size="13.5" fill="#e7eefb" font-weight="600">Баллы за бег — скидки и оплата</text>
  <text x="854" y="376" font-size="13.5" fill="#e7eefb" font-weight="600">в магазине МАТА.</text>

  <rect x="1219" y="248" width="42" height="42" rx="12" fill="#a78bfa" fill-opacity="0.16"/><use href="#ic-users" x="1225" y="254" width="30" height="30" stroke="#c4b0fb"/>
  <text x="1275" y="275" class="t-h" font-size="17.5" fill="#f1ecfb">Бег не в одиночку</text>
  <circle cx="1223" cy="320" r="3.2" fill="#ef6b6b"/><text x="1237" y="325" font-size="13.5" fill="#94a4bd">Одному скучно, бросаешь быстрее.</text>
  <circle cx="1223" cy="350" r="3.2" fill="#34d399"/><text x="1237" y="355" font-size="13.5" fill="#e7eefb" font-weight="600">Клубы, забеги и борьба</text>
  <text x="1237" y="376" font-size="13.5" fill="#e7eefb" font-weight="600">за районы с друзьями.</text>

  <!-- ===== КАК ЭТО РАБОТАЕТ ===== -->
  <text x="48" y="430" class="t-sec" font-size="12" fill="#5fd0f0">КАК ЭТО РАБОТАЕТ — 4 ШАГА</text>
  <g filter="url(#soft)">
    <rect x="48"   y="444" width="355" height="132" rx="17" fill="url(#cardCyan)" stroke="#22d3ee" stroke-opacity="0.34" stroke-width="1.3"/>
    <rect x="431"  y="444" width="355" height="132" rx="17" fill="url(#cardCyan)" stroke="#22d3ee" stroke-opacity="0.34" stroke-width="1.3"/>
    <rect x="814"  y="444" width="355" height="132" rx="17" fill="url(#cardCyan)" stroke="#22d3ee" stroke-opacity="0.34" stroke-width="1.3"/>
    <rect x="1197" y="444" width="355" height="132" rx="17" fill="url(#cardCyan)" stroke="#22d3ee" stroke-opacity="0.34" stroke-width="1.3"/>
  </g>
  <text x="296"  y="525" class="t-title" font-size="40" fill="#1d4f64" text-anchor="middle">1</text>
  <text x="679"  y="525" class="t-title" font-size="40" fill="#1d4f64" text-anchor="middle">2</text>
  <text x="1062" y="525" class="t-title" font-size="40" fill="#1d4f64" text-anchor="middle">3</text>
  <text x="1445" y="525" class="t-title" font-size="40" fill="#1d4f64" text-anchor="middle">4</text>
  <rect x="70"   y="466" width="42" height="42" rx="12" fill="#22d3ee" fill-opacity="0.14"/><use href="#ic-run" x="76" y="472" width="30" height="30" stroke="#7de4f5"/>
  <text x="126" y="493" class="t-h" font-size="17" fill="#e6fbff">Беги</text>
  <text x="72" y="534" font-size="13.5" fill="#9fc4d2">Выходи на пробежку</text>
  <text x="72" y="554" font-size="13.5" fill="#9fc4d2">с телефоном.</text>
  <rect x="453"  y="466" width="42" height="42" rx="12" fill="#22d3ee" fill-opacity="0.14"/><use href="#ic-map" x="459" y="472" width="30" height="30" stroke="#7de4f5"/>
  <text x="509" y="493" class="t-h" font-size="17" fill="#e6fbff">Захватывай</text>
  <text x="455" y="534" font-size="13.5" fill="#9fc4d2">Маршрут закрашивает</text>
  <text x="455" y="554" font-size="13.5" fill="#9fc4d2">район за тобой.</text>
  <rect x="836"  y="466" width="42" height="42" rx="12" fill="#22d3ee" fill-opacity="0.14"/><use href="#ic-coin" x="842" y="472" width="30" height="30" stroke="#7de4f5"/>
  <text x="892" y="493" class="t-h" font-size="17" fill="#e6fbff">Зарабатывай</text>
  <text x="838" y="534" font-size="13.5" fill="#9fc4d2">Километры становятся</text>
  <text x="838" y="554" font-size="13.5" fill="#9fc4d2">баллами.</text>
  <rect x="1219" y="466" width="42" height="42" rx="12" fill="#22d3ee" fill-opacity="0.14"/><use href="#ic-bag" x="1225" y="472" width="30" height="30" stroke="#7de4f5"/>
  <text x="1275" y="493" class="t-h" font-size="17" fill="#e6fbff">Трать</text>
  <text x="1221" y="534" font-size="13.5" fill="#9fc4d2">Меняй баллы на товары</text>
  <text x="1221" y="554" font-size="13.5" fill="#9fc4d2">в магазине МАТА.</text>
  <text x="417"  y="519" font-size="24" fill="#2a5266" text-anchor="middle">&#8250;</text>
  <text x="800"  y="519" font-size="24" fill="#2a5266" text-anchor="middle">&#8250;</text>
  <text x="1183" y="519" font-size="24" fill="#2a5266" text-anchor="middle">&#8250;</text>

  <!-- ===== ВОЗМОЖНОСТИ И ДОРОЖНАЯ КАРТА ===== -->
  <text x="48" y="604" class="t-sec" font-size="12" fill="#aebfd6">ВОЗМОЖНОСТИ И ДОРОЖНАЯ КАРТА</text>
  <g filter="url(#soft)">
    <rect x="48"  y="618" width="728" height="206" rx="17" fill="url(#cardGreen)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.4"/>
    <rect x="824" y="618" width="728" height="206" rx="17" fill="url(#cardSlate)" stroke="#94a3b8" stroke-opacity="0.42" stroke-width="1.3" stroke-dasharray="9 5"/>
  </g>
  <!-- left: уже работает -->
  <rect x="72" y="640" width="44" height="44" rx="13" fill="#34d399" fill-opacity="0.16"/><use href="#ic-check" x="80" y="648" width="28" height="28" stroke="#7eecbf"/>
  <text x="128" y="662" class="t-h" font-size="19" fill="#e6f6ed">Уже работает</text>
  <text x="128" y="681" font-size="12" fill="#74a78e" font-weight="600">доступно в приложении сейчас</text>
  <g font-size="14" fill="#d6e6dd">
    <use href="#ic-check" x="78" y="696" width="15" height="15" stroke="#34d399"/><text x="100" y="708">Захват районов по GPS — твоя карта города</text>
    <use href="#ic-check" x="78" y="717" width="15" height="15" stroke="#34d399"/><text x="100" y="729">Баллы за каждую пробежку — честно, серверно</text>
    <use href="#ic-check" x="78" y="738" width="15" height="15" stroke="#34d399"/><text x="100" y="750">Старты: афиша забегов города, напоминания, регистрация</text>
    <use href="#ic-check" x="78" y="759" width="15" height="15" stroke="#34d399"/><text x="100" y="771">Магазин экипировки — оплата и скидки баллами</text>
    <use href="#ic-check" x="78" y="780" width="15" height="15" stroke="#34d399"/><text x="100" y="792">Клубы, рейтинги и совместные забеги</text>
    <use href="#ic-check" x="78" y="801" width="15" height="15" stroke="#34d399"/><text x="100" y="813">Единый аккаунт и единый баланс на всё</text>
  </g>
  <!-- right: в планах -->
  <rect x="848" y="640" width="44" height="44" rx="13" fill="#94a3b8" fill-opacity="0.15"/><use href="#ic-arrow" x="856" y="648" width="28" height="28" stroke="#c4cedd"/>
  <text x="904" y="662" class="t-h" font-size="19" fill="#e7edf6">В планах — что добавим</text>
  <text x="904" y="681" font-size="12" fill="#7d8ba3" font-weight="600">обещаем и ведём к этому экосистему</text>
  <g font-size="14.5" fill="#c4d0df">
    <use href="#ic-arrow" x="854" y="700" width="15" height="15" stroke="#94a3b8"/><text x="876" y="712">Бег с умных часов (Garmin / Coros) — без телефона</text>
    <use href="#ic-arrow" x="854" y="726" width="15" height="15" stroke="#94a3b8"/><text x="876" y="738">Оплата заказов: ЮKassa / СБП</text>
    <use href="#ic-arrow" x="854" y="752" width="15" height="15" stroke="#94a3b8"/><text x="876" y="764">Пуш-уведомления и вход по SMS-коду</text>
    <use href="#ic-arrow" x="854" y="778" width="15" height="15" stroke="#94a3b8"/><text x="876" y="790">Единая лояльность с офлайн-магазином (1С Розница)</text>
    <use href="#ic-arrow" x="854" y="804" width="15" height="15" stroke="#94a3b8"/><text x="876" y="816">Акции, сезоны и новые города на карте</text>
  </g>

  <!-- ===== ИТОГ ===== -->
  <g filter="url(#soft)"><rect x="48" y="844" width="1504" height="84" rx="18" fill="url(#cardHero)" stroke="#34d399" stroke-opacity="0.38" stroke-width="1.5"/></g>
  <text x="800" y="881" class="t-title" font-size="23" fill="#ffffff" text-anchor="middle">МАТА — система лояльности нового типа: твоя валюта — это километры.</text>
  <text x="800" y="908" font-size="14" fill="#a7c6d4" font-weight="500" text-anchor="middle">Беги, копи баллы и трать их на экипировку — со временем онлайн и в офлайн-магазине вместе.</text>

  <!-- ===== FOOTER ===== -->
  <line x1="48" y1="952" x2="1552" y2="952" stroke="#172339" stroke-width="1.2"/>
  <text x="48" y="978" class="t-h" font-size="13" fill="#aebfd6">МАТА · экосистема для бегунов</text>
  <text x="800" y="978" font-size="11" fill="#66758c" font-weight="500" text-anchor="middle">Ранний доступ: часть возможностей в разработке; карта районов расширяется по городам.</text>
  <text x="1552" y="978" font-size="12" fill="#6f7f97" font-weight="500" text-anchor="end">беги · копи баллы · трать на экипировку</text>

</svg>
</body>
</html>
